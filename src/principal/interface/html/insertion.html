<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insertion Sort</title>
    <link rel="stylesheet" href="../estilo/style.css">
</head>
<body>
    <div class="container">
        <a href="inicio.html" class="btn-voltar">← Voltar</a>
        <header>
            <h1>Insertion Sort</h1>
        </header>
        <div class="controls-group"> 
            <button>1.000</button>
            <button>10.000</button>
            <button>100.000</button>
            <input type="number" placeholder="Digite a quantidade...">
        </div>
        <div class="upload-section">
            <input type="file" id="arquivo" hidden>
            <label for="arquivo" class="btn-upload">
                Carregar arquivo
            </label>
        </div>
    </div>
</body>
</html>
